name: clinic_eln
description: Flutter desktop prototype for creating and managing electronic sick-leave certificates (ELN) with SFR.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dart_odbc: ^6.2.0
  cryptography: ^2.7.0
  file_picker: ^8.0.7
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
